{% extends 'base.html' %}

{% block titulo %}Edição de veiculo {{ object.modelo }} {% endblock %}

{% block conteudo %}
<div class="modal fade" id="confirmDeleteModal{{ veiculo.id }}" tabindex="-1" aria-labelledby="modalLabel{{ veiculo.id }}" aria-hidden="true">
    <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel{{ veiculo.id }}">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                    <div class="modal-body">
                            Você tem certeza que deseja excluir o veículo: <strong>{{ veiculo.modelo }} - {{ veiculo.placa }}</strong>?
                            <br><br>
                            <p class="text-danger">Esta ação não poderá ser desfeita.</p>
                    </div>
                    <div class="modal-footer">
                        
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        
                        <form action="/veiculo/deletar/{{ veiculo.id }}/" method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                        </form>

                    </div>
            </div>
    </div>
</div>
{% endblock %}
