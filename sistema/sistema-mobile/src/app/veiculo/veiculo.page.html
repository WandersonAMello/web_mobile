<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Meus Veículos (Simplificado)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>

    <ion-item-sliding *ngFor="let veiculo of lista_veiculos">

      <ion-item>
        <ion-thumbnail slot="start">
          <img [src]="veiculo.foto" *ngIf="veiculo.foto; else iconePadrao" />
          <ng-template #iconePadrao>
            <ion-icon name="car-sport-outline" size="large" color="medium"></ion-icon>
          </ng-template>
        </ion-thumbnail>
        
        <ion-label>
          <h2>{{ veiculo.nome_marca }} {{ veiculo.modelo }}</h2>
          <p>{{ veiculo.ano }} | {{ veiculo.nome_cor }}</p>
          <p>Combustível: {{ veiculo.nome_combustivel }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options slot="end">
        <ion-item-option color="danger" (click)="excluirVeiculo(veiculo.id)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding> </ion-list>
</ion-content>
